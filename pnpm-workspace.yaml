allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  sharp: true
  unrs-resolver: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
auditConfig:
  # ESLint still requires brace-expansion@1, which has no compatible patched release.
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
minimumReleaseAgeExclude:
  - brace-expansion@1.1.16
  - brace-expansion@5.0.8
  - postcss@8.5.18
overrides:
  '@hono/node-server': 2.0.10
  'brace-expansion@>=5.0.0 <=5.0.7': ^5.0.8
  fast-uri: 3.1.4
  postcss: '>=8.5.18'
  sharp: 0.35.0
